<head>
<title>Space Huggers</title>
<link rel=icon type=image/x-icon href='favicon.ico'/>
<meta name="title" content="Space Huggers"></meta>
<meta name="author" content="Frank Force"></meta>
<meta name="description" content="A run and gun roguelike platformer with destructible environments"></meta>
<meta name=viewport content='width=device-width,initial-scale=1,user-scalable=0'>
<meta charset=utf-8>
<style>
html,body{margin:0;background:#000}
/* Fire TV error overlay: only visible if the game throws on startup.
   Sits above the canvas so a white-screen failure is diagnosable. */
#errbox{display:none;position:fixed;left:0;top:0;width:100%;height:100%;
  background:#000;color:#fff;font:20px monospace;padding:24px;box-sizing:border-box;
  white-space:pre-wrap;overflow:auto;z-index:9999}
#errbox.show{display:block}
#errbox h1{color:#f55;font-size:24px;margin:0 0 12px 0}
#errbox .hint{color:#aaa;font-size:16px;margin-top:16px}
</style>
</head>
<body>
<div id=errbox><h1>Space Huggers failed to start</h1><pre id=errtext></pre>
<div class=hint>If you see this on a Fire TV, run:  adb logcat -d chromium:V *:E  to capture the full log.</div></div>
<script>
// Catch JS errors before the engine has a chance to swallow them. Anything
// thrown in a script tag (including engineWebGL.js shader compile failures,
// engine.js startup errors, etc.) ends up rendered in #errbox so a white
// screen is diagnosable on-device.
function showError(msg){
  var box=document.getElementById('errbox');
  var txt=document.getElementById('errtext');
  if(!box||!txt) return;
  txt.textContent += msg + '\n\n';
  box.className = 'show';
}
window.addEventListener('error',     function(e){ showError('Error: ' + (e.message||e.error)); });
window.addEventListener('unhandledrejection', function(e){ showError('Promise: ' + (e.reason && e.reason.stack || e.reason)); });

// Polyfill CanvasRenderingContext2D.roundRect for Amazon Fire TV WebView
// (Chrome 118 TV fork may omit this API despite it landing in Chrome 99).
if (typeof CanvasRenderingContext2D !== 'undefined' &&
    !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    var rad = typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 0);
    rad = Math.min(rad, Math.min(w, h) / 2);
    this.moveTo(x + rad, y);
    this.lineTo(x + w - rad, y);
    this.arcTo(x + w, y,     x + w, y + rad,     rad);
    this.lineTo(x + w, y + h - rad);
    this.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    this.lineTo(x + rad, y + h);
    this.arcTo(x,     y + h, x,     y + h - rad, rad);
    this.lineTo(x,     y + rad);
    this.arcTo(x,     y,     x + rad, y,          rad);
    this.closePath();
  };
}
</script>
